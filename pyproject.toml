[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "worldpolicy"
version = "0.1.0"
description = "Auditable robot policy learning research baselines"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "torch>=2.3", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]
simulation = ["mujoco>=3.2,<4", "imageio>=2.30", "imageio-ffmpeg>=0.5"]
manipulation = ["gymnasium-robotics>=1.4,<2", "imageio>=2.30", "imageio-ffmpeg>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
worldpolicy = ["assets/*.xml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
